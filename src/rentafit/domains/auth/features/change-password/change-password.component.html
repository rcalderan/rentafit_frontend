<div class="setup-container">
    <div class="setup-card">
        <h2>Alterar Senha</h2>
        <p class="subtitle">Sua senha expirou. Defina uma nova senha para continuar.</p>

        @if (errorMessage()) {
        <div class="error-message">
            {{ errorMessage() }}
        </div>
        }

        <div class="form-group">
            <label for="newPassword">Nova Senha</label>
            <input
                type="password"
                id="newPassword"
                [(ngModel)]="newPassword"
                placeholder="Mínimo 10 caracteres"
                [disabled]="isLoading()"
                (keyup.enter)="submit()">
            @if (passwordErrors.length > 0) {
            <ul class="validation-hints">
                @for (err of passwordErrors; track err) {
                <li>{{ err }}</li>
                }
            </ul>
            }
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Senha</label>
            <input
                type="password"
                id="confirmPassword"
                [(ngModel)]="confirmPassword"
                placeholder="Repita a senha"
                [disabled]="isLoading()"
                (keyup.enter)="submit()">
            @if (passwordMismatch) {
            <span class="field-error">As senhas não conferem</span>
            }
        </div>

        <button
            (click)="submit()"
            [disabled]="isLoading() || !isFormValid">
            {{ isLoading() ? 'Salvando...' : 'Confirmar' }}
        </button>
    </div>
</div>
